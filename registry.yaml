registry:
  id: ENGINEERING-REGISTRY
  name: Naineet Cloud Engineering Registry
  version: 1.0.0

infrastructures:
  - id: INF-SMART-METER
    file: infrastructures/smart-meter.yaml

projects:
  - id: SM-UTILITY
    file: projects/smart-meter-utility.yaml

  - id: SM-SOCIETY
    file: projects/smart-meter-society.yaml

implementations:
  - id: SM-UTILITY-001
    file: implementations/sm-utility-001.yaml

developers:
  naineet_fellows:
    type: fellow
    path: developers/naineet-fellows
