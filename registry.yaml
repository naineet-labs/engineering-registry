  - id: TEAM-001
    file: teams/team-001.yaml

technologies:
  - id: TECH-REACT
    file: technologies/react.yaml

  - id: TECH-SPRING-BOOT
    file: technologies/spring-boot.yaml

  - id: TECH-PYTHON
    file: technologies/python.yaml